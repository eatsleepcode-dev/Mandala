<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian — UI Prototype</title>
<style>
  :root {
    --bg: #1e1e1e;
    --bg-sidebar: #252526;
    --bg-panel: #2d2d30;
    --bg-card: #3c3c3c;
    --bg-card-hover: #464646;
    --bg-input: #3c3c3c;
    --border: #3e3e42;
    --border-light: #555;
    --fg: #cccccc;
    --fg-dim: #858585;
    --fg-muted: #6a6a6a;
    --blue: #0e639c;
    --blue-light: #1177bb;
    --blue-bright: #4fc3f7;
    --green: #4caf50;
    --green-dim: #2d6a30;
    --amber: #ff9800;
    --amber-dim: #6b4000;
    --red: #f44336;
    --red-dim: #6b1a14;
    --purple: #9c27b0;
    --purple-dim: #4a0e56;
    --teal: #009688;
    --teal-dim: #004d40;
    --accent: #0e639c;
    --tag-bg: #37373d;
    --sprint-complete: #1a3a1e;
    --sprint-active: #1a2a3a;
    --sprint-planned: #2a2a1a;
    --font: 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'Cascadia Code', 'Fira Code', monospace;
    --radius: 4px;
    --shadow: 0 2px 8px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    font-size: 13px;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  .sidebar {
    width: 48px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 0;
    gap: 4px;
    flex-shrink: 0;
    z-index: 10;
  }

  .sidebar-icon {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius);
    cursor: pointer;
    color: var(--fg-dim);
    font-size: 18px;
    transition: all 0.15s;
    border: 1px solid transparent;
    position: relative;
  }

  .sidebar-icon:hover { color: var(--fg); background: var(--bg-card); }
  .sidebar-icon.active { color: var(--fg); border-color: var(--blue); background: rgba(14,99,156,0.15); }

  .sidebar-icon .tooltip {
    position: absolute;
    left: 48px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    padding: 4px 8px;
    border-radius: var(--radius);
    white-space: nowrap;
    font-size: 11px;
    color: var(--fg);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 100;
    box-shadow: var(--shadow);
  }

  .sidebar-icon:hover .tooltip { opacity: 1; }

  .sidebar-divider {
    width: 28px;
    height: 1px;
    background: var(--border);
    margin: 4px 0;
  }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .topbar {
    height: 38px;
    background: var(--bg-sidebar);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    flex-shrink: 0;
  }

  .topbar-title {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--fg-dim);
  }

  .topbar-badge {
    background: var(--green-dim);
    color: var(--green);
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 10px;
    font-weight: 600;
  }

  .topbar-score {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--fg-dim);
  }

  .topbar-score span { color: var(--green); font-weight: 600; }

  .topbar-date {
    font-size: 11px;
    color: var(--fg-muted);
    font-family: var(--font-mono);
  }

  .view { display: none; flex: 1; overflow: hidden; flex-direction: column; }
  .view.active { display: flex; }

  .view-header {
    padding: 14px 20px 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .view-header h2 { font-size: 14px; font-weight: 600; }
  .view-header .subtitle { font-size: 11px; color: var(--fg-dim); }

  .view-body {
    flex: 1;
    overflow: auto;
    padding: 16px 20px;
  }

  .story-map-container { overflow: auto; }

  .story-map-activities {
    display: flex;
    gap: 0;
    min-width: max-content;
    margin-bottom: 0;
  }

  .activity-col {
    min-width: 200px;
    border-right: 1px solid var(--border);
  }

  .activity-header {
    padding: 10px 12px;
    background: var(--bg-panel);
    border-bottom: 2px solid var(--blue);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--blue-bright);
    text-transform: uppercase;
    position: sticky;
    top: 0;
    z-index: 5;
  }

  .activity-meta {
    font-size: 10px;
    color: var(--fg-muted);
    font-weight: 400;
    text-transform: none;
    letter-spacing: 0;
    margin-top: 2px;
  }

  .swim-lane {
    border-bottom: 1px solid var(--border);
  }

  .swim-lane-label {
    padding: 6px 12px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--fg-muted);
    background: var(--bg-sidebar);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    overflow: hidden;
  }

  .swim-lane-cards {
    padding: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 56px;
  }

  .story-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 8px;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    min-width: 140px;
    max-width: 175px;
  }

  .story-card:hover { background: var(--bg-card-hover); border-color: var(--border-light); transform: translateY(-1px); box-shadow: var(--shadow); }

  .story-card.complete { border-left: 3px solid var(--green); }
  .story-card.in-progress { border-left: 3px solid var(--amber); }
  .story-card.planned { border-left: 3px solid var(--fg-muted); }
  .story-card.blocked { border-left: 3px solid var(--red); }

  .card-title { font-weight: 600; margin-bottom: 3px; color: var(--fg); }
  .card-meta { font-size: 10px; color: var(--fg-dim); display: flex; gap: 6px; flex-wrap: wrap; }
  .card-tag { background: var(--tag-bg); padding: 1px 5px; border-radius: 3px; }
  .card-status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 4px; }
  .dot-green { background: var(--green); }
  .dot-amber { background: var(--amber); }
  .dot-gray { background: var(--fg-muted); }
  .dot-red { background: var(--red); }

  .sprint-col-header {
    min-width: 120px;
    flex-shrink: 0;
    border-right: 2px solid var(--border);
  }

  .sprint-label-cell {
    padding: 6px 10px;
    background: var(--bg-sidebar);
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .sprint-num { font-size: 11px; font-weight: 700; color: var(--blue-bright); }
  .sprint-title { font-size: 10px; color: var(--fg-dim); margin-top: 2px; }
  .sprint-status-badge {
    font-size: 9px;
    margin-top: 3px;
    padding: 1px 5px;
    border-radius: 3px;
    width: fit-content;
  }
  .badge-complete { background: var(--green-dim); color: var(--green); }
  .badge-planned { background: var(--amber-dim); color: var(--amber); }
  .badge-active { background: var(--sprint-active); color: var(--blue-bright); border: 1px solid var(--blue); }

  .diary-layout { display: flex; gap: 0; height: 100%; overflow: hidden; }

  .diary-sidebar {
    width: 280px;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    flex-shrink: 0;
  }

  .diary-date-group { margin-bottom: 0; }

  .diary-date-label {
    padding: 8px 12px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--fg-muted);
    background: var(--bg-sidebar);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 2;
  }

  .diary-entry-row {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }

  .diary-entry-row:hover { background: var(--bg-card); }
  .diary-entry-row.active { background: var(--sprint-active); border-left: 2px solid var(--blue); }

  .diary-hash {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--blue-bright);
    flex-shrink: 0;
    margin-top: 2px;
  }

  .diary-entry-title {
    font-size: 11px;
    color: var(--fg);
    line-height: 1.4;
  }

  .diary-entry-type {
    font-size: 10px;
    color: var(--fg-muted);
    margin-top: 2px;
  }

  .type-feat { color: #4fc3f7; }
  .type-test { color: #81c784; }
  .type-fix { color: #ffb74d; }
  .type-chore { color: var(--fg-muted); }
  .type-docs { color: #ce93d8; }
  .type-tidy { color: #80cbc4; }

  .diary-content {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
  }

  .diary-content-header {
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .diary-content-hash {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--blue-bright);
    margin-bottom: 6px;
  }

  .diary-content-title {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 8px;
  }

  .diary-content-meta {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .diary-chip {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--tag-bg);
    color: var(--fg-dim);
  }

  .diary-chip.branch { background: rgba(14,99,156,0.2); color: var(--blue-bright); }
  .diary-chip.td { background: var(--amber-dim); color: var(--amber); }
  .diary-chip.adr { background: var(--purple-dim); color: #ce93d8; }

  .diary-body { font-size: 12px; line-height: 1.7; color: var(--fg); }
  .diary-body h3 { font-size: 12px; color: var(--fg-dim); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.06em; }
  .diary-body .file-list { display: flex; flex-wrap: wrap; gap: 4px; }
  .diary-body .file-tag { background: var(--tag-bg); font-family: var(--font-mono); font-size: 10px; padding: 2px 6px; border-radius: 3px; color: var(--fg-dim); }
  .diary-body .cycle-badge { display: inline-block; width: 14px; height: 14px; border-radius: 50%; text-align: center; line-height: 14px; font-size: 9px; font-weight: 700; margin-right: 4px; }
  .badge-red-cycle { background: var(--red-dim); color: var(--red); }
  .badge-green-cycle { background: var(--green-dim); color: var(--green); }

  .calendar-layout { display: flex; gap: 0; height: 100%; overflow: hidden; }

  .calendar-main { flex: 1; overflow-y: auto; padding: 0; }

  .week-header {
    display: grid;
    grid-template-columns: 60px repeat(5, 1fr);
    border-bottom: 2px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg-sidebar);
    z-index: 3;
  }

  .week-header-day {
    padding: 8px 10px;
    font-size: 11px;
    font-weight: 600;
    color: var(--fg-dim);
    text-align: center;
    border-left: 1px solid var(--border);
  }

  .week-header-day.today { color: var(--blue-bright); }
  .week-header-day .day-num { font-size: 18px; font-weight: 300; display: block; color: var(--fg); }
  .week-header-day.today .day-num {
    background: var(--blue);
    color: white;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    line-height: 32px;
    margin: 0 auto;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
  }

  .calendar-grid {
    display: grid;
    grid-template-columns: 60px repeat(5, 1fr);
  }

  .time-col { font-size: 10px; color: var(--fg-muted); text-align: right; padding-right: 8px; padding-top: 4px; border-right: 1px solid var(--border); }
  .time-slot { border-bottom: 1px solid var(--border); height: 48px; display: flex; align-items: flex-start; }
  .time-slot.half { border-bottom: 1px dashed var(--border); height: 24px; }
  .day-slot { border-left: 1px solid var(--border); border-bottom: 1px solid var(--border); height: 48px; position: relative; padding: 2px; }
  .day-slot.today-col { background: rgba(14,99,156,0.04); }

  .cal-event {
    position: absolute;
    left: 2px; right: 2px;
    border-radius: var(--radius);
    padding: 3px 6px;
    font-size: 10px;
    font-weight: 500;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    cursor: pointer;
    z-index: 1;
  }

  .cal-event.sprint { background: rgba(14,99,156,0.3); border-left: 3px solid var(--blue); color: var(--fg); }
  .cal-event.tdd { background: rgba(76,175,80,0.2); border-left: 3px solid var(--green); color: var(--fg); }
  .cal-event.review { background: rgba(156,39,176,0.2); border-left: 3px solid var(--purple); color: var(--fg); }
  .cal-event.hitl { background: rgba(255,152,0,0.2); border-left: 3px solid var(--amber); color: var(--fg); }

  .calendar-sidebar {
    width: 260px;
    border-left: 1px solid var(--border);
    overflow-y: auto;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div class="main"></div>
</body>
</html>
